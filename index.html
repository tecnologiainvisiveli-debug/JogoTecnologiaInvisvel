<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome do jogo</title>

    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="Cores e Tipografia.css">
    
</head>
<body>
    <header>
        <h1>Nome do Jogo</h1>
    </header>

    <div id="sideBar">
        <label for="jogoPrincipal" class="btnAbas">
            <img src="imagens/icones/cpu.svg" alt=" " class="imgAbas">
            Continuar Jogando
        </label>

        <label for="statusPersonagem" class="btnAbas">
            <img src="imagens/icones/laptop.svg" alt=" " class="imgAbas">
            Status do Personagem
        </label>

        <label for="historico" class="btnAbas">
            <img src="imagens/icones/hdd-stack.svg" alt=" " class="imgAbas">
            Historico
        </label>
    </div>

    
    <input type="radio" name="abas" id="jogoPrincipal" checked>
    <div class="abas">aba1</div>

    <input type="radio" name="abas" id="statusPersonagem">
    <div class="abas">aba2</div>

    <input type="radio" name="abas" id="historico">
    <div class="abas">aba3</div>
</body>
</html>
